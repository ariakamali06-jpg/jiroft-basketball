<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت | هیئت بسکتبال جیرفت</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { fontFamily: { sans: ['Vazirmatn', 'sans-serif'] }, colors: { brand: { black: '#0a0a0a', dark: '#1a1a1a', card: '#242424', yellow: '#facc15', red: '#ef4444', orange: '#f97316' } } } }
        }
    </script>
    <style>
        body { background-color: #0a0a0a; color: #ffffff; }
        .glass-panel { background: rgba(30, 30, 30, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .form-input { background: rgba(0, 0, 0, 0.3); border: 1px solid #374151; color: white; }
        .form-label { color: #d1d5db; }
        .btn { transition: all 0.2s; }
        .btn:hover { transform: translateY(-1px); }
    </style>
</head>
<body class="font-sans min-h-screen py-8 px-4 md:px-8">

    <div class="max-w-7xl mx-auto">
        <!-- Header -->
        <div class="flex items-center justify-between mb-8">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-gear text-brand-yellow text-3xl"></i>
                <div>
                    <h1 class="text-2xl md:text-3xl font-black text-white">پنل مدیریت سایت</h1>
                    <p class="text-sm text-gray-400">مدیریت بازیکنان، اخبار، ویدیوها و محتوای سایت</p>
                </div>
            </div>
            <button onclick="logout()" class="bg-brand-red hover:bg-red-600 text-white px-4 py-2 rounded-lg text-sm font-bold">
                <i class="fa-solid fa-right-from-bracket ml-2"></i> خروج
            </button>
        </div>

        <!-- Tabs -->
        <div class="flex flex-wrap gap-2 mb-8">
            <button onclick="switchTab('players')" class="tab-btn px-6 py-3 rounded-xl font-bold bg-brand-yellow text-brand-black flex items-center gap-2 hover:bg-yellow-300">
                <i class="fa-solid fa-users"></i> مدیریت بازیکنان
            </button>
            <button onclick="switchTab('news')" class="tab-btn px-6 py-3 rounded-xl font-bold bg-brand-dark text-gray-300 border border-gray-700 hover:border-brand-yellow flex items-center gap-2 hover:bg-brand-card">
                <i class="fa-solid fa-newspaper"></i> مدیریت اخبار
            </button>
            <button onclick="switchTab('videos')" class="tab-btn px-6 py-3 rounded-xl font-bold bg-brand-dark text-gray-300 border border-gray-700 hover:border-brand-yellow flex items-center gap-2 hover:bg-brand-card">
                <i class="fa-solid fa-video"></i> مدیریت ویدیوها
            </button>
            <button onclick="switchTab('settings')" class="tab-btn px-6 py-3 rounded-xl font-bold bg-brand-dark text-gray-300 border border-gray-700 hover:border-brand-yellow flex items-center gap-2 hover:bg-brand-card">
                <i class="fa-solid fa-cog"></i> تنظیمات
            </button>
        </div>

        <!-- Players Tab -->
        <div id="tab-players" class="tab-content">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold text-white">مدیریت بازیکنان تیم</h2>
                <button onclick="openPlayerModal()" class="bg-brand-yellow hover:bg-yellow-300 text-brand-black px-4 py-2 rounded-lg font-bold flex items-center gap-2">
                    <i class="fa-solid fa-plus"></i> بازیکن جدید
                </button>
            </div>

            <!-- Filter -->
            <div class="flex gap-4 mb-6">
                <select id="player-team-filter" onchange="filterPlayers()" class="form-input px-4 py-2 rounded-lg">
                    <option value="all">همه تیم‌ها</option>
                    <option value="male">تیم آقایان</option>
                    <option value="female">تیم بانوان</option>
                </select>
                <input type="text" id="player-search" oninput="filterPlayers()" placeholder="جستجوی بازیکن..." class="form-input px-4 py-2 rounded-lg flex-1">
            </div>

            <div id="players-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <!-- Players will be loaded here -->
            </div>
        </div>

        <!-- News Tab -->
        <div id="tab-news" class="tab-content hidden">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold text-white">مدیریت اخبار</h2>
                <button onclick="openNewsModal()" class="bg-brand-yellow hover:bg-yellow-300 text-brand-black px-4 py-2 rounded-lg font-bold flex items-center gap-2">
                    <i class="fa-solid fa-plus"></i> خبر جدید
                </button>
            </div>
            <div id="news-list" class="space-y-4">
                <!-- News items will be loaded here -->
            </div>
        </div>

        <!-- Videos Tab -->
        <div id="tab-videos" class="tab-content hidden">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold text-white">مدیریت ویدیوها</h2>
                <button onclick="openVideoModal()" class="bg-brand-yellow hover:bg-yellow-300 text-brand-black px-4 py-2 rounded-lg font-bold flex items-center gap-2">
                    <i class="fa-solid fa-plus"></i> ویدیو جدید
                </button>
            </div>
            <div id="videos-list" class="space-y-4">
                <!-- Videos will be loaded here -->
            </div>
        </div>

        <!-- Settings Tab -->
        <div id="tab-settings" class="tab-content hidden">
            <div class="glass-panel rounded-2xl p-6">
                <h2 class="text-xl font-bold text-white mb-4">تنظیمات پایه</h2>
                <div class="space-y-4">
                    <div>
                        <label class="form-label block mb-1">عنوان سایت</label>
                        <input type="text" id="site-title" value="هیئت بسکتبال جیرفت" class="form-input w-full px-4 py-2 rounded-lg">
                    </div>
                    <div>
                        <label class="form-label block mb-1">توضیحات</label>
                        <textarea id="site-description" class="form-input w-full px-4 py-2 rounded-lg h-24" placeholder="توضیحات کوتاه سایت..."></textarea>
                    </div>
                    <button onclick="saveSettings()" class="bg-brand-yellow hover:bg-yellow-300 text-brand-black px-6 py-2 rounded-lg font-bold w-full md:w-auto">
                        <i class="fa-solid fa-save ml-2"></i> ذخیره تنظیمات
                    </button>
                </div>
            </div>
        </div>

    </div>

    <!-- Modal -->
    <div id="modal" class="fixed inset-0 z-50 hidden bg-brand-black/80 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="glass-panel rounded-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto">
            <div class="p-6 border-b border-gray-700 flex justify-between items-center">
                <h3 id="modal-title" class="text-xl font-bold text-white">عنوان</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-white text-2xl">&times;</button>
            </div>
            <div id="modal-content" class="p-6">
                <!-- Modal content will be injected here -->
            </div>
        </div>
    </div>

    <script>
        // Simple data store - in production this would be a real backend
        let players = JSON.parse(localStorage.getItem('players') || '[]');
        let news = JSON.parse(localStorage.getItem('news') || '[]');
        let videos = JSON.parse(localStorage.getItem('videos') || '[]');
        let settings = JSON.parse(localStorage.getItem('settings') || '{}');

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            if (!players.length) loadInitialData();
            if (settings.siteTitle) document.getElementById('site-title').value = settings.siteTitle;
            if (settings.siteDescription) document.getElementById('site-description').value = settings.siteDescription;
            renderPlayers();
            renderNews();
            renderVideos();
        });

        function loadInitialData() {
            players = [
                { id: 'aria-kamali', name: 'آریا کمالی', number: '1', position: 'پوینت گارد (PG)', height: '185', team: 'male', bio: 'پوینت گارد تیم آقایان جیرفت بسکت.', stats: { matches: 24, ppg: 18.5, rpg: 4.2, apg: 6.8, spg: 1.9 }, image: 'u1.jpg' },
                { id: 'iliah-kamali', name: 'ایلیا کمالی', number: '2', position: 'شوتینگ گارد (SG)', height: '190', team: 'male', bio: 'شوتینگ گارد تیم آقایان.', stats: { matches: 22, ppg: 16.3, rpg: 3.8, apg: 3.2, spg: 1.4 }, image: 'u2.jpg' }
            ];
            savePlayers();
        }

        function savePlayers() { localStorage.setItem('players', JSON.stringify(players)); renderPlayers(); }
        function saveNews() { localStorage.setItem('news', JSON.stringify(news)); renderNews(); }
        function saveVideos() { localStorage.setItem('videos', JSON.stringify(videos)); renderVideos(); }
        function saveSettings() { settings = { siteTitle: document.getElementById('site-title').value, siteDescription: document.getElementById('site-description').value }; localStorage.setItem('settings', JSON.stringify(settings)); alert('تنظیمات ذخیره شد!'); }

        // Tab switching
        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(`tab-${tab}`).classList.remove('hidden');
            
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('bg-brand-yellow', 'text-brand-black');
                btn.classList.add('bg-brand-dark', 'text-gray-300', 'border-gray-700');
            });
            event.currentTarget.classList.add('bg-brand-yellow', 'text-brand-black');
            event.currentTarget.classList.remove('bg-brand-dark', 'text-gray-300', 'border-gray-700');
        }

        // Players
        function renderPlayers() {
            const team = document.getElementById('player-team-filter').value;
            const search = document.getElementById('player-search').value.toLowerCase();
            const list = document.getElementById('players-list');
            
            const filtered = players.filter(p => {
                const matchesTeam = team === 'all' || p.team === team;
                const matchesSearch = p.name.toLowerCase().includes(search) || p.position.toLowerCase().includes(search);
                return matchesTeam && matchesSearch;
            });

            list.innerHTML = filtered.map((p, i) => `
                <div class="glass-panel rounded-xl p-4 hover:border-brand-yellow/50 transition-colors">
                    <div class="flex items-start gap-4">
                        <img src="assets/images/${p.image}" alt="${p.name}" class="w-20 h-20 rounded-lg object-cover">
                        <div class="flex-1">
                            <div class="flex justify-between items-start">
                                <div>
                                    <h3 class="font-bold text-white text-lg">${p.name}</h3>
                                    <p class="text-brand-yellow text-sm">${p.position}</p>
                                </div>
                                <div class="flex gap-2">
                                    <button onclick="editPlayer(${i})" class="text-brand-yellow hover:text-white"><i class="fa-solid fa-pen"></i></button>
                                    <button onclick="deletePlayer(${i})" class="text-brand-red hover:text-white"><i class="fa-solid fa-trash"></i></button>
                                </div>
                            </div>
                            <div class="mt-3 grid grid-cols-3 gap-2 text-center text-sm">
                                <div class="bg-brand-black/50 rounded p-1"><span class="text-white font-bold">${p.stats.matches}</span> مسابقه</div>
                                <div class="bg-brand-black/50 rounded p-1"><span class="text-brand-yellow font-bold">${p.stats.ppg}</span> امتیاز</div>
                                <div class="bg-brand-black/50 rounded p-1"><span class="text-brand-orange font-bold">${p.stats.apg}</span> پاس</div>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function filterPlayers() { renderPlayers(); }

        function openPlayerModal(id = null) {
            const player = id !== null ? players[id] : {};
            document.getElementById('modal-title').innerText = player.id ? 'ویرایش بازیکن' : 'بازیکن جدید';
            
            const teams = [
                { id: 'male', name: 'تیم آقایان' },
                { id: 'female', name: 'تیم بانوان' }
            ];

            const html = `
                <form onsubmit="savePlayer(event, ${player.id ? `players.indexOf(players.find(p => p.id === '${player.id}'))` : 'null'})">
                    <input type="hidden" name="id" value="${player.id || generateId()}">
                    
                    <div class="mb-4">
                        <label class="form-label block mb-1">نام بازیکن</label>
                        <input type="text" name="name" value="${player.name || ''}" required class="form-input w-full px-4 py-2 rounded-lg">
                    </div>
                    
                    <div class="grid grid-cols-2 gap-4 mb-4">
                        <div>
                            <label class="form-label block mb-1">شماره پیراهن</label>
                            <input type="number" name="number" value="${player.number || ''}" required class="form-input w-full px-4 py-2 rounded-lg">
                        </div>
                        <div>
                            <label class="form-label block mb-1">تیم</label>
                            <select name="team" required class="form-input w-full px-4 py-2 rounded-lg">
                                ${teams.map(t => `<option value="${t.id}" ${player.team === t.id ? 'selected' : ''}>${t.name}</option>`).join('')}
                            </select>
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <label class="form-label block mb-1">موقعیت بازی</label>
                        <input type="text" name="position" value="${player.position || ''}" required class="form-input w-full px-4 py-2 rounded-lg">
                    </div>
                    
                    <div class="grid grid-cols-2 gap-4 mb-4">
                        <div>
                            <label class="form-label block mb-1">قد (سانتی‌متر)</label>
                            <input type="number" name="height" value="${player.height || ''}" class="form-input w-full px-4 py-2 rounded-lg">
                        </div>
                        <div>
                            <label class="form-label block mb-1">عکس</label>
                            <input type="text" name="image" value="${player.image || 'player-default.jpg'}" class="form-input w-full px-4 py-2 rounded-lg" placeholder="player-default.jpg">
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <label class="form-label block mb-1">بیوگرافی</label>
                        <textarea name="bio" class="form-input w-full px-4 py-2 rounded-lg h-24">${player.bio || ''}</textarea>
                    </div>
                    
                    <div class="bg-brand-black/30 rounded-lg p-4 mb-4">
                        <h4 class="font-bold mb-2 text-brand-yellow">آمار مسابقات</h4>
                        <div class="grid grid-cols-4 gap-2">
                            <div><label class="text-xs text-gray-400">مسابقه</label><input type="number" name="stats_matches" value="${player.stats?.matches || 0}" class="form-input w-full px-2 py-1 rounded text-sm"></div>
                            <div><label class="text-xs text-gray-400">امتیاز</label><input type="number" step="0.1" name="stats_ppg" value="${player.stats?.ppg || 0}" class="form-input w-full px-2 py-1 rounded text-sm"></div>
                            <div><label class="text-xs text-gray-400">ریبایت</label><input type="number" step="0.1" name="stats_rpg" value="${player.stats?.rpg || 0}" class="form-input w-full px-2 py-1 rounded text-sm"></div>
                            <div><label class="text-xs text-gray-400">پاس</label><input type="number" step="0.1" name="stats_apg" value="${player.stats?.apg || 0}" class="form-input w-full px-2 py-1 rounded text-sm"></div>
                        </div>
                    </div>
                    
                    <div class="flex gap-3">
                        <button type="submit" class="bg-brand-yellow hover:bg-yellow-300 text-brand-black px-6 py-2 rounded-lg font-bold flex-1">ذخیره</button>
                        <button type="button" onclick="closeModal()" class="bg-brand-dark hover:bg-gray-700 text-white px-6 py-2 rounded-lg font-bold">لغو</button>
                    </div>
                </form>
            `;
            
            document.getElementById('modal-content').innerHTML = html;
            document.getElementById('modal').classList.remove('hidden');
        }

        function savePlayer(e, index) {
            e.preventDefault();
            const formData = new FormData(e.target);
            
            const playerData = {
                id: formData.get('id'),
                name: formData.get('name'),
                number: formData.get('number'),
                position: formData.get('position'),
                height: formData.get('height'),
                team: formData.get('team'),
                bio: formData.get('bio'),
                image: formData.get('image'),
                stats: {
                    matches: parseInt(formData.get('stats_matches')) || 0,
                    ppg: parseFloat(formData.get('stats_ppg')) || 0,
                    rpg: parseFloat(formData.get('stats_rpg')) || 0,
                    apg: parseFloat(formData.get('stats_apg')) || 0,
                    spg: 0
                }
            };
            
            if (index === null) {
                players.push(playerData);
            } else {
                players[index] = playerData;
            }
            
            savePlayers();
            closeModal();
        }

        function deletePlayer(index) {
            if (confirm('آیا مطمئن هستید؟')) {
                players.splice(index, 1);
                savePlayers();
            }
        }

        function editPlayer(index) { openPlayerModal(index); }

        function generateId() {
            return Math.random().toString(36).substring(2, 9);
        }

        // News
        function renderNews() {
            const list = document.getElementById('news-list');
            list.innerHTML = news.map((n, i) => `
                <div class="glass-panel rounded-xl p-4 flex items-start gap-4">
                    <div class="bg-brand-yellow text-brand-black w-12 h-12 rounded-lg flex items-center justify-center font-black">${n.date.split('-')[2]}</div>
                    <div class="flex-1">
                        <h3 class="font-bold text-white text-lg">${n.title}</h3>
                        <p class="text-gray-400 text-sm mb-2">${n.date} | ${n.category}</p>
                        <p class="text-gray-300 text-sm line-clamp-2">${n.content}</p>
                        <div class="mt-2 flex gap-2">
                            <button onclick="editNews(${i})" class="text-brand-yellow hover:text-white text-sm"><i class="fa-solid fa-pen"></i> ویرایش</button>
                            <button onclick="deleteNews(${i})" class="text-brand-red hover:text-white text-sm"><i class="fa-solid fa-trash"></i> حذف</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function openNewsModal(id = null) {
            const newsItem = id !== null ? news[id] : {};
            document.getElementById('modal-title').innerText = newsItem.id ? 'ویرایش خبر' : 'خبر جدید';
            
            const html = `
                <form onsubmit="saveNewsItem(event, ${id !== null ? id : 'null'})">
                    <input type="hidden" name="id" value="${newsItem.id || generateId()}">
                    
                    <div class="mb-4">
                        <label class="form-label block mb-1">عنوان خبر</label>
                        <input type="text" name="title" value="${newsItem.title || ''}" required class="form-input w-full px-4 py-2 rounded-lg">
                    </div>
                    
                    <div class="grid grid-cols-2 gap-4 mb-4">
                        <div>
                            <label class="form-label block mb-1">تاریخ</label>
                            <input type="date" name="date" value="${newsItem.date || new Date().toISOString().split('T')[0]}" class="form-input w-full px-4 py-2 rounded-lg">
                        </div>
                        <div>
                            <label class="form-label block mb-1">دسته‌بندی</label>
                            <select name="category" class="form-input w-full px-4 py-2 rounded-lg">
                                <option value="ورزشی" ${newsItem.category === 'ورزشی' ? 'selected' : ''}>ورزشی</option>
                                <option value="رویدادها" ${newsItem.category === 'رویدادها' ? 'selected' : ''}>رویدادها</option>
                                <option value="تیم" ${newsItem.category === 'تیم' ? 'selected' : ''}>تیم</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <label class="form-label block mb-1">محتوا</label>
                        <textarea name="content" class="form-input w-full px-4 py-2 rounded-lg h-32">${newsItem.content || ''}</textarea>
                    </div>
                    
                    <div class="flex gap-3">
                        <button type="submit" class="bg-brand-yellow hover:bg-yellow-300 text-brand-black px-6 py-2 rounded-lg font-bold flex-1">ذخیره</button>
                        <button type="button" onclick="closeModal()" class="bg-brand-dark hover:bg-gray-700 text-white px-6 py-2 rounded-lg font-bold">لغو</button>
                    </div>
                </form>
            `;
            
            document.getElementById('modal-content').innerHTML = html;
            document.getElementById('modal').classList.remove('hidden');
        }

        function saveNewsItem(e, index) {
            e.preventDefault();
            const formData = new FormData(e.target);
            const newsData = {
                id: formData.get('id'),
                title: formData.get('title'),
                date: formData.get('date'),
                category: formData.get('category'),
                content: formData.get('content')
            };
            
            if (index === null) {
                news.unshift(newsData);
            } else {
                news[index] = newsData;
            }
            
            saveNews();
            closeModal();
        }

        function deleteNews(index) {
            if (confirm('آیا مطمئن هستید؟')) {
                news.splice(index, 1);
                saveNews();
            }
        }

        function editNews(index) { openNewsModal(index); }

        // Videos
        function renderVideos() {
            const list = document.getElementById('videos-list');
            list.innerHTML = videos.map((v, i) => `
                <div class="glass-panel rounded-xl p-4 flex items-start gap-4">
                    <div class="bg-brand-red text-white w-12 h-12 rounded-lg flex items-center justify-center"><i class="fa-solid fa-circle-play"></i></div>
                    <div class="flex-1">
                        <h3 class="font-bold text-white text-lg">${v.title}</h3>
                        <p class="text-gray-400 text-sm mb-2">${v.playerName || 'همه بازیکنان'} | ${v.date}</p>
                        <a href="${v.url}" target="_blank" class="text-brand-yellow hover:text-yellow-300 text-sm">${v.url}</a>
                        <div class="mt-2 flex gap-2">
                            <button onclick="editVideo(${i})" class="text-brand-yellow hover:text-white text-sm"><i class="fa-solid fa-pen"></i> ویرایش</button>
                            <button onclick="deleteVideo(${i})" class="text-brand-red hover:text-white text-sm"><i class="fa-solid fa-trash"></i> حذف</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function openVideoModal(id = null) {
            const videoItem = id !== null ? videos[id] : {};
            document.getElementById('modal-title').innerText = videoItem.id ? 'ویرایش ویدیو' : 'ویدیو جدید';
            
            const html = `
                <form onsubmit="saveVideoItem(event, ${id !== null ? id : 'null'})">
                    <input type="hidden" name="id" value="${videoItem.id || generateId()}">
                    
                    <div class="mb-4">
                        <label class="form-label block mb-1">عنوان ویدیو</label>
                        <input type="text" name="title" value="${videoItem.title || ''}" required class="form-input w-full px-4 py-2 rounded-lg">
                    </div>
                    
                    <div class="mb-4">
                        <label class="form-label block mb-1">نام بازیکن (اختیاری)</label>
                        <select name="playerName" class="form-input w-full px-4 py-2 rounded-lg">
                            <option value="">همه بازیکنان</option>
                            ${players.map(p => `<option value="${p.name}" ${videoItem.playerName === p.name ? 'selected' : ''}>${p.name}</option>`).join('')}
                        </select>
                    </div>
                    
                    <div class="mb-4">
                        <label class="form-label block mb-1">لینک یوتیوب</label>
                        <input type="text" name="url" value="${videoItem.url || 'https://youtube.com/watch?v='}" class="form-input w-full px-4 py-2 rounded-lg">
                    </div>
                    
                    <div class="flex gap-3">
                        <button type="submit" class="bg-brand-yellow hover:bg-yellow-300 text-brand-black px-6 py-2 rounded-lg font-bold flex-1">ذخیره</button>
                        <button type="button" onclick="closeModal()" class="bg-brand-dark hover:bg-gray-700 text-white px-6 py-2 rounded-lg font-bold">لغو</button>
                    </div>
                </form>
            `;
            
            document.getElementById('modal-content').innerHTML = html;
            document.getElementById('modal').classList.remove('hidden');
        }

        function saveVideoItem(e, index) {
            e.preventDefault();
            const formData = new FormData(e.target);
            const videoData = {
                id: formData.get('id'),
                title: formData.get('title'),
                playerName: formData.get('playerName'),
                url: formData.get('url'),
                date: new Date().toISOString().split('T')[0]
            };
            
            if (index === null) {
                videos.unshift(videoData);
            } else {
                videos[index] = videoData;
            }
            
            saveVideos();
            closeModal();
        }

        function deleteVideo(index) {
            if (confirm('آیا مطمئن هستید؟')) {
                videos.splice(index, 1);
                saveVideos();
            }
        }

        function editVideo(index) { openVideoModal(index); }

        // Modal
        function closeModal() { document.getElementById('modal').classList.add('hidden'); }
        function logout() { alert('خروج از پنل مدیریت'); }
    </script>
</body>
</html>
